name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium --no-shell

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: python scripts/quality_baseline.py --full --output .verification/quality

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-python-${{ matrix.python-version }}
          path: .verification/quality/
          include-hidden-files: true
          if-no-files-found: warn

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t garden:ci .

      - name: Start image with a newly migrated volume
        run: |
          volume=$(docker volume create)
          container=
          trap 'if [ -n "$container" ]; then docker rm -f "$container"; fi; docker volume rm "$volume"' EXIT
          docker run --rm --network none -v "$volume:/app/data" garden:ci garden db upgrade
          container=$(docker run -d --network none -v "$volume:/app/data" garden:ci)
          for attempt in {1..20}; do
            if docker exec "$container" python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=1).read()' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

  cli-smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: gardenctl --help
        run: python -m app.cli.main --help

      - name: gardenctl healthcheck
        run: python -m app.cli.main healthcheck

  windows-installer:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read desktop toolchain pins
        id: pins
        shell: pwsh
        run: |
          $pins = Get-Content desktop/build-versions.json -Raw | ConvertFrom-Json
          "python=$($pins.windows.python)" >> $env:GITHUB_OUTPUT
          "rust=$($pins.rust)" >> $env:GITHUB_OUTPUT
          "target=$($pins.windows.target)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pins.outputs.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/python-build-requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install build dependencies
        shell: pwsh
        run: |
          rustup toolchain install "${{ steps.pins.outputs.rust }}-${{ steps.pins.outputs.target }}" --profile minimal
          rustup override set "${{ steps.pins.outputs.rust }}-${{ steps.pins.outputs.target }}"
          python -m pip install -r desktop/python-build-requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund

      - name: Build engine and NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .verification | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD .verification/browsers
          $env:GARDEN_BUILD_BROWSERS = $env:PLAYWRIGHT_BROWSERS_PATH
          $env:GARDEN_OPENSSL_LICENSE = Join-Path $PWD .verification/OpenSSL-LICENSE.txt
          $openssl = python -c "import ssl; print(ssl.OPENSSL_VERSION.split()[1])"
          Invoke-WebRequest "https://raw.githubusercontent.com/openssl/openssl/openssl-$openssl/LICENSE.txt" -OutFile $env:GARDEN_OPENSSL_LICENSE
          python -m playwright install chromium
          python desktop/build_engine.py
          python desktop/build_notices.py
          python desktop/build_app.py

      - name: Install, launch, connect, reinstall and uninstall
        run: python desktop/verify_windows.py
