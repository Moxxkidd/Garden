{% extends 'base.html' %}{% block content %}<section class="identity-page project-page" hx-boost="false"><h1>多入口 / 身份计划 · {{ project.name }}</h1><p>每个选择建立独立子任务，队列只访问本入口 origin。请先完成身份引导；跨 origin 线索须另加项目入口后重新预览。</p><form method="post" action="/identities/projects/{{ project.id }}/plan/preview"><label>计划请求总上限<input type="number" name="total_requests" min="1" max="40000" value="300" required></label>{% for e in entries %}<fieldset><legend><label><input type="checkbox" name="entry_ids" value="{{ e.id }}">{{ e.name }} · {{ e.url }}</label></legend><label>入口 {{ e.id }} 身份<select name="profile_{{ e.id }}"><option value="">匿名</option>{% for p in profiles if p.target_id == e.target_id %}<option value="{{ p.id }}">{{ p.name }} · #{{ p.id }}</option>{% endfor %}</select></label><label>入口 {{ e.id }} 交互方式<select name="mode_{{ e.id }}"><option value="automatic">自动只读</option><option value="manual">人工浏览（须有已验证身份）</option></select></label><label>入口 {{ e.id }} 固定配额（留空按顺序分配）<input name="budget_{{ e.id }}" type="number" min="1" max="2000"></label></fieldset>{% endfor %}<button>预览全部入口与预算</button></form></section>{% endblock %}
