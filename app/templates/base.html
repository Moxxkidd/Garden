<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title or "Garden" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body class="min-h-screen bg-stone-100 text-slate-900" hx-boost="true">
    <header class="border-b border-black/10 bg-white/80 backdrop-blur">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
        <a href="/" class="text-xl font-semibold tracking-tight">Garden</a>
        <nav class="flex gap-3 text-sm text-slate-600">
          <a href="/" class="rounded-full border border-black/10 px-3 py-1.5 hover:bg-stone-100">Dashboard</a>
          <a href="/scans" class="rounded-full border border-black/10 px-3 py-1.5 hover:bg-stone-100">URL Scans</a>
        </nav>
      </div>
    </header>
    <main class="mx-auto max-w-6xl px-6 py-10">
      {% block content %}{% endblock %}
    </main>
    <script>
      (function () {
        const units = [
          { max: 60, fmt: function (n) { return 'just now'; } },
          { max: 3600, div: 60, suffix: 'm ago' },
          { max: 86400, div: 3600, suffix: 'h ago' },
          { max: 604800, div: 86400, suffix: 'd ago' },
        ];
        function friendly(el) {
          var iso = el.getAttribute('data-iso');
          if (!iso) return;
          var then = new Date(iso);
          var diff = (Date.now() - then.getTime()) / 1000;
          for (var i = 0; i < units.length; i++) {
            var u = units[i];
            if (diff < u.max) {
              el.textContent = u.fmt ? u.fmt(diff) : Math.floor(diff / u.div) + u.suffix;
              return;
            }
          }
          el.textContent = then.getFullYear() + '-' +
            String(then.getMonth() + 1).padStart(2, '0') + '-' +
            String(then.getDate()).padStart(2, '0') + ' ' +
            String(then.getHours()).padStart(2, '0') + ':' +
            String(then.getMinutes()).padStart(2, '0');
        }
        document.querySelectorAll('time[data-iso]').forEach(function (el) { friendly(el); });
      })();
    </script>
  </body>
</html>
