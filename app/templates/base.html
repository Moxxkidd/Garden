<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title or "Garden" }}</title>
    <link rel="stylesheet" href="/static/vendor/tailwind-3.4.17.css" />
    <script src="/static/vendor/htmx-1.9.12.min.js" defer></script>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body class="min-h-screen bg-stone-100 text-slate-900" hx-boost="true">
    <header class="border-b border-black/10 bg-white/80 backdrop-blur">
      <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 flex-wrap px-6 py-4">
        <a href="/" class="text-xl font-semibold tracking-tight">Garden</a>
        <nav aria-label="主导航" class="flex flex-wrap gap-3 text-sm text-slate-600">
          {% for href,label in [('/projects','项目'),('/scans','任务'),('/assets','资产'),('/identities','身份'),('/reports','报告'),('/settings','设置')] %}
          <a href="{{ href }}" class="rounded-full border border-black/10 px-3 py-1.5 hover:bg-stone-100">{{ label }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>
    <main class="mx-auto max-w-6xl px-6 py-10">
      {% block content %}{% endblock %}
    </main>
    <script>
      (function () {
        const units = [
          { max: 60, fmt: function (n) { return '刚刚'; } },
          { max: 3600, div: 60, suffix: ' 分钟前' },
          { max: 86400, div: 3600, suffix: ' 小时前' },
          { max: 604800, div: 86400, suffix: ' 天前' },
        ];
        function friendly(el) {
          var iso = el.getAttribute('data-iso');
          if (!iso) return;
          var then = new Date(iso);
          var diff = (Date.now() - then.getTime()) / 1000;
          for (var i = 0; i < units.length; i++) {
            var u = units[i];
            if (diff < u.max) {
              el.textContent = u.fmt ? u.fmt(diff) : Math.floor(diff / u.div) + u.suffix;
              return;
            }
          }
          el.textContent = then.getFullYear() + '-' +
            String(then.getMonth() + 1).padStart(2, '0') + '-' +
            String(then.getDate()).padStart(2, '0') + ' ' +
            String(then.getHours()).padStart(2, '0') + ':' +
            String(then.getMinutes()).padStart(2, '0');
        }
        document.querySelectorAll('time[data-iso]').forEach(function (el) { friendly(el); });
      })();
    </script>
  </body>
</html>
